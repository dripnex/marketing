name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://dripnex-marketing.pages.dev
          NEXT_PUBLIC_DOCS_URL: https://dripnex-docs.pages.dev
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler pages project create dripnex-marketing --production-branch main >create.log 2>&1; then
            if grep -qi 'already exists' create.log; then
              echo "Pages project dripnex-marketing already exists"
            else
              cat create.log
              exit 1
            fi
          fi
          npx wrangler pages deploy out --project-name dripnex-marketing --branch main
